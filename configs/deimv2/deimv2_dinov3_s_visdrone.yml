__include__: [
  '../dataset/visdrone_detection.yml',
  '../runtime.yml',
  '../base/dataloader.yml',
  '../base/optimizer.yml',
  '../base/deimv2.yml',
]

output_dir: ./outputs/DEIMv2_dinov3_s_visdrone

# ---- Override num_classes for VisDrone (10 classes) ----
num_classes: 10

# ---- Print every 50 iters; save every 5 epochs ----
print_freq: 50
checkpoint_freq: 5

DEIM:
  backbone: DINOv3STAs

DINOv3STAs:
  name: vit_tiny
  embed_dim: 192
  weights_path: ./ckpts/vitt_distill.pt
  interaction_indexes: [3, 7, 11]   # maps to [1/8, 1/16, 1/32] feature levels
  num_heads: 3

HybridEncoder:
  in_channels: [192, 192, 192]
  depth_mult: 0.67
  expansion: 0.34
  hidden_dim: 192
  dim_feedforward: 512

DEIMTransformer:
  feat_channels: [192, 192, 192]
  hidden_dim: 192
  dim_feedforward: 512
  num_layers: 4
  eval_idx: -1
  num_queries: 300
  num_denoising: 30     # reduced further to save memory on single GPU

PostProcessor:
  num_top_queries: 300  # must match num_queries

# ---- Optimizer (same param groups as dinov3_s_coco) ----
optimizer:
  type: AdamW
  params:
    -
      params: '^(?=.*.dinov3)(?!.*(?:norm|bn|bias)).*$'
      lr: 0.0000125   # scaled: 0.000025 * (8/16)
    -
      params: '^(?=.*.dinov3)(?=.*(?:norm|bn|bias)).*$'
      lr: 0.0000125   # scaled: 0.000025 * (8/16)
      weight_decay: 0.
    -
      params: '^(?=.*(?:sta|encoder|decoder))(?=.*(?:norm|bn|bias)).*$'
      weight_decay: 0.

  lr: 0.0001         # scaled: 0.0005 * (8/16)
  betas: [0.9, 0.999]
  weight_decay: 0.0005

# ---- Epoch schedule ----
# Decreased to 200 epochs per standard VisDrone schedule
# flat_epoch = 4 + epoches // 2
epoches: 200

# ---- LR scheduler ----
lrsheduler: flatcosine
lr_gamma: 0.5
warmup_iter: 2000
flat_epoch: 140    # 4 + epoches // 2
no_aug_epoch: 20

# ---- DataLoader for 2x4090 ----
train_dataloader:
  total_batch_size: 2     # reduced from 4 to prevent OOM on single RTX 4090
  num_workers: 8
  dataset:
    transforms:
      ops:
        - {type: Mosaic, output_size: 320, rotation_range: 10, translation_range: [0.1, 0.1], scaling_range: [0.5, 1.5],
           probability: 1.0, fill_value: 0, use_cache: True, max_cached_images: 50, random_pop: True}
        - {type: RandomPhotometricDistort, p: 0.5}
        - {type: RandomZoomOut, fill: 0}
        - {type: RandomIoUCrop, p: 0.8}
        - {type: SanitizeBoundingBoxes, min_size: 1}
        - {type: RandomHorizontalFlip}
        - {type: Resize, size: [640, 640], }
        - {type: SanitizeBoundingBoxes, min_size: 1}
        - {type: ConvertPILImage, dtype: 'float32', scale: True}
        - {type: Normalize, mean: [0.485, 0.456, 0.406], std: [0.229, 0.224, 0.225]}
        - {type: ConvertBoxes, fmt: 'cxcywh', normalize: True}
      policy:
        epoch: [4, 140, 180]   # [warmup_end, flat_end, stop_epoch]

  collate_fn:
    base_size: 640
    max_size: 640      # keep 640 cap to avoid OOM on RTX 4090
    mixup_prob: 0.5
    ema_restart_decay: 0.9999
    base_size_repeat: 20
    mixup_epochs: [4, 140]     # aligned with flat_epoch
    stop_epoch: 180            # 200 - 20 (no_aug_epoch)
    copyblend_epochs: [4, 180] # aligned with stop_epoch
    copyblend_prob: 0.5
    area_threshold: 100
    num_objects: 3
    with_expand: True
    expand_ratios: [0.1, 0.25]

val_dataloader:
  total_batch_size: 16    # 8 per GPU x 2 GPUs
  num_workers: 8
  dataset:
    transforms:
      ops:
        - {type: Resize, size: [640, 640], }
        - {type: ConvertPILImage, dtype: 'float32', scale: True}
        - {type: Normalize, mean: [0.485, 0.456, 0.406], std: [0.229, 0.224, 0.225]}

# ---- Loss ----
DEIMCriterion:
  weight_dict: {loss_mal: 1, loss_bbox: 5, loss_giou: 2, loss_fgl: 0.15, loss_ddf: 1.5}
  losses: ['mal', 'boxes', 'local']
  gamma: 1.5
  alpha: 0.75
  reg_max: 32
  matcher:
    type: HungarianMatcher
    weight_dict: {cost_class: 2, cost_bbox: 5, cost_giou: 2}
    alpha: 0.25
    gamma: 2.0
    change_matcher: True
    iou_order_alpha: 4.0
    matcher_change_epoch: 140   # proportional for 200 epochs
