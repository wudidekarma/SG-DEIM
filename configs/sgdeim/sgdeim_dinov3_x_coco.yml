__include__: [
  '../dataset/coco_detection.yml',
  '../runtime.yml',
  '../base/dataloader.yml',
  '../base/optimizer.yml',
  '../base/deimv2.yml',
]

output_dir: ./outputs/SG-DEIM_dinov3_x_combined_coco

# X-level SG-DEIM: CGSR + CSAI (Encoder) + QCAG (Decoder)
DEIM:
  backbone: DINOv3STAs
  encoder: SGDEIMEncoder    # paper: CGSR + CSAI encoder
  decoder: DEIMTransformer

DINOv3STAs:
  name: dinov3_vits16plus
  weights_path: ./ckpts/dinov3_vits16plus_pretrain_lvd1689m-4057cbaa.pth
  interaction_indexes: [5, 8, 11]   # only need [1/8, 1/16, 1/32]
  finetune: True
  conv_inplane: 64
  hidden_dim: 256

SGDEIMEncoder:
  in_channels: [256, 256, 256]
  hidden_dim: 256
  dim_feedforward: 1024
  # X-level cross-scale capacity
  expansion: 1.25
  depth_mult: 1.37
  version: 'deim'
  fuse_op: 'sum'
  # CGSR + CSAI configuration.
  use_csai: True
  csai_position: 'both'
  csai_type: 'efficient'
  csai_kernel_size: 5
  csai_reduction: 4
  use_cgsr: True
  cgsr_num_bands: 4
  cgsr_reduction: 4
  cgsr_max_strength: 0.5

DEIMTransformer:
  num_layers: 6
  eval_idx: -1
  feat_channels: [256, 256, 256]
  hidden_dim: 256
  dim_feedforward: 2048
  num_queries: 300
  # Lower denoising count to reduce unstable gradients in late training
  num_denoising: 50
  # QCAG configuration
  use_qcag: True
  qcag_mode: 'headwise_v2'
  qcag_residual_ratio: 0.1

optimizer:
  type: AdamW
  params:
    -
      # except norm/bn/bias in self.dinov3
      params: '^(?=.*.dinov3)(?!.*(?:norm|bn|bias)).*$'
      lr: 0.00001
    -
      # including norm/bn/bias in self.dinov3
      params: '^(?=.*.dinov3)(?=.*(?:norm|bn|bias)).*$'
      lr: 0.00001
      weight_decay: 0.
    -
      # including norm/bn/bias except for the self.dinov3
      params: '^(?=.*(?:sta|encoder|decoder))(?=.*(?:norm|bn|bias)).*$'
      weight_decay: 0.

  lr: 0.0003
  betas: [0.9, 0.999]
  weight_decay: 0.000125

## X-level LR schedule (explicit for readability)
epoches: 50
lrsheduler: flatcosine
lr_gamma: 0.5
warmup_iter: 2000
flat_epoch: 30
no_aug_epoch: 10

## Dense O2O: Mosaic + Mixup + CopyBlend
train_dataloader:
  # 2x4090 (24G) balanced setting for upgraded X model
  total_batch_size: 16
  num_workers: 2
  dataset:
    transforms:
      ops:
        - {type: Mosaic, output_size: 320, rotation_range: 10, translation_range: [0.1, 0.1], scaling_range: [0.5, 1.5],
          probability: 0.7, fill_value: 0, use_cache: False, max_cached_images: 50, random_pop: True}
        - {type: RandomPhotometricDistort, p: 0.5}
        - {type: RandomZoomOut, fill: 0}
        - {type: RandomIoUCrop, p: 0.6}
        - {type: SanitizeBoundingBoxes, min_size: 1}
        - {type: RandomHorizontalFlip}
        - {type: Resize, size: [640, 640], }
        - {type: SanitizeBoundingBoxes, min_size: 1}
        - {type: ConvertPILImage, dtype: 'float32', scale: True}
        - {type: Normalize, mean: [0.485, 0.456, 0.406], std: [0.229, 0.224, 0.225]}
        - {type: ConvertBoxes, fmt: 'cxcywh', normalize: True}
      policy:
        epoch: [4, 35, 62]

  collate_fn:
    type: BatchImageCollateFunction
    base_size: 640
    base_size_repeat: 3
    mixup_epochs: [4, 35]
    stop_epoch: 62
    copyblend_epochs: [4, 62]
    mixup_prob: 0.3

val_dataloader:
  total_batch_size: 32
  num_workers: 2
  dataset:
    transforms:
      ops:
        - {type: Resize, size: [640, 640], }
        - {type: ConvertPILImage, dtype: 'float32', scale: True}
        - {type: Normalize, mean: [0.485, 0.456, 0.406], std: [0.229, 0.224, 0.225]}
