__include__: [
  '../dataset/coco_detection.yml',
  '../runtime.yml',
  '../base/dataloader.yml',
  '../base/optimizer.yml',
  '../base/deimv2.yml',
]

output_dir: ./outputs/SG-DEIM_dinov3_m_combined_coco

DEIM:
  backbone: DINOv3STAs
  encoder: SGDEIMEncoder    # paper: CGSR + CSAI encoder
  decoder: DEIMTransformer        # paper: QCAG decoder

DINOv3STAs:
  name: vit_tinyplus
  embed_dim: 256
  weights_path: ./ckpts/vittplus_distill.pt
  interaction_indexes: [3, 7, 11]   # only need the [1/8, 1/16, 1/32]
  num_heads: 4

SGDEIMEncoder:
  in_channels: [256, 256, 256]
  depth_mult: 1
  expansion: 0.67
  hidden_dim: 256
  dim_feedforward: 512
  version: 'deim'
  fuse_op: 'sum'
  # CGSR + CSAI configuration.
  use_csai: True
  csai_position: 'both'        # 应用于 FPN 和 PAN
  csai_type: 'efficient'       # Efficient CSAI implementation
  csai_kernel_size: 5          
  csai_reduction: 4
  use_cgsr: True
  cgsr_num_bands: 4
  cgsr_reduction: 4
  cgsr_max_strength: 0.5

DEIMTransformer:
  feat_channels: [256, 256, 256]
  hidden_dim: 256
  dim_feedforward: 512
  num_layers: 4  # 4 5 6
  eval_idx: -1  # -2 -3 -4
  # QCAG configuration
  use_qcag: True
  qcag_mode: 'headwise_v2'
  qcag_residual_ratio: 0.1

optimizer:
  type: AdamW

  params: 
    -
      # except norm/bn/bias in self.dinov3
      params: '^(?=.*.dinov3)(?!.*(?:norm|bn|bias)).*$'  
      lr: 0.000025
    -
      # including norm/bn/bias in self.dinov3
      params: '^(?=.*.dinov3)(?=.*(?:norm|bn|bias)).*$'    
      lr: 0.000025
      weight_decay: 0.
    - 
      # including norm/bn/bias except for the self.dinov3
      params: '^(?=.*(?:sta|encoder|decoder))(?=.*(?:norm|bn|bias)).*$'
      weight_decay: 0.

  lr: 0.0005
  betas: [0.9, 0.999]
  weight_decay: 0.0001

epoches: 100 # 120 + 4n  (严格参考原版 m 级的 epoch)

## Our LR-Scheduler
flat_epoch: 50    
no_aug_epoch: 12


## Our DataAug
train_dataloader:
  dataset: 
    transforms:
      ops:
        - {type: Mosaic, output_size: 320, rotation_range: 10, translation_range: [0.1, 0.1], scaling_range: [0.5, 1.5],
           probability: 1.0, fill_value: 0, use_cache: True, max_cached_images: 50, random_pop: True}
        - {type: RandomPhotometricDistort, p: 0.5}
        - {type: RandomZoomOut, fill: 0}
        - {type: RandomIoUCrop, p: 0.8}
        - {type: SanitizeBoundingBoxes, min_size: 1}
        - {type: RandomHorizontalFlip}
        - {type: Resize, size: [640, 640], }
        - {type: SanitizeBoundingBoxes, min_size: 1}
        - {type: ConvertPILImage, dtype: 'float32', scale: True}
        - {type: Normalize, mean: [0.485, 0.456, 0.406], std: [0.229, 0.224, 0.225]}
        - {type: ConvertBoxes, fmt: 'cxcywh', normalize: True}
      policy:
        epoch: [4, 49, 90]   # list (严格参考原版 m 级的阶段)

  collate_fn:
    mixup_prob: 0.5
    ema_restart_decay: 0.9999
    base_size_repeat: 6
    mixup_epochs: [4, 49]
    stop_epoch: 90
    copyblend_epochs: [4, 90]


val_dataloader:
  dataset:
    transforms:
      ops:
        - {type: Resize, size: [640, 640], }
        - {type: ConvertPILImage, dtype: 'float32', scale: True}
        - {type: Normalize, mean: [0.485, 0.456, 0.406], std: [0.229, 0.224, 0.225]}

DEIMCriterion:
  matcher:
    # new matcher
    change_matcher: True
    iou_order_alpha: 4.0
    matcher_change_epoch: 80
