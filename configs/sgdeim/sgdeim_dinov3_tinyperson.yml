__include__: [
  '../dataset/tinyperson_detection.yml',
  '../runtime.yml',
  '../base/dataloader.yml',
  '../base/optimizer.yml',
  '../base/deimv2.yml',
]

output_dir: ./outputs/SG-DEIM_dinov3_s_tinyperson

# Online validation during training uses the patch-level COCO evaluator that
# is integrated with the distributed DEIM solver. Official TinyPerson AP is
# computed after training by merging patch detections back to original images.
evaluator:
  type: CocoEvaluator
  iou_types: ['bbox']

tinyperson_official_eval:
  enabled: True
  official_root: ./third_party/PointTinyBenchmark_TinyBenchmark/tiny_benchmark
  corner_gt_file: /media/q/data/ys/datasets/TinyPerson/OpenDataLab___TinyPerson/aw1/annotations/corner/task/tiny_set_test_sw640_sh512_all.json
  merged_gt_file: /media/q/data/ys/datasets/TinyPerson/OpenDataLab___TinyPerson/aw1/annotations/task/tiny_set_test_all.json
  metric: ap
  score_threshold: 0.001
  nms_iou: 0.5
  max_det: 1000
  # Keep epoch validation fast. `train.py --test-only` always runs the
  # official evaluator; set this to True only when official AP is needed each epoch.
  run_during_training: False
  frequency: 1
  fail_on_error: True

num_classes: 1
print_freq: 50
checkpoint_freq: 5
eval_spatial_size: [640, 640]

use_ema: True
ema:
  type: ModelEMA
  decay: 0.9999
  warmups: 1000

# ----------------- 核心架构 -----------------
DEIM:
  backbone: DINOv3STAs
  encoder: SGDEIMEncoder    # paper: CGSR + CSAI encoder
  decoder: DEIMTransformer        # paper: QCAG decoder

DINOv3STAs:
  name: vit_tiny
  embed_dim: 192
  weights_path: ./ckpts/vitt_distill.pt
  interaction_indexes: [0, 3, 7, 11]  # maps to full P2/P3/P4/P5 outputs
  num_heads: 3

SGDEIMEncoder:
  # TinyPerson uses full P2 access instead of the lightweight P2-to-P3 bypass.
  in_channels: [192, 192, 192, 192]
  feat_strides: [4, 8, 16, 32]
  depth_mult: 0.67
  expansion: 0.34
  hidden_dim: 192
  dim_feedforward: 512
  use_encoder_idx: [3]
  version: 'deim'
  fuse_op: 'sum'
  # CGSR + CSAI configuration.
  use_csai: True
  csai_position: 'both'
  csai_type: 'efficient'
  csai_kernel_size: 5
  csai_reduction: 4
  use_cgsr: True
  cgsr_num_bands: 4
  cgsr_reduction: 4
  cgsr_max_strength: 0.5

DEIMTransformer:
  feat_channels: [192, 192, 192, 192]
  feat_strides: [4, 8, 16, 32]
  num_levels: 4
  num_points: [3, 3, 6, 3] # tuned deformable sampling points for P2/P3/P4/P5
  hidden_dim: 192
  dim_feedforward: 512
  num_layers: 4
  eval_idx: -1
  num_queries: 600      # more queries for dense tiny-person scenes
  num_denoising: 200
  use_qcag: True  # QCAG: query-conditioned head-level write filtering
  qcag_mode: 'headwise_v2'
  qcag_residual_ratio: 0.1

PostProcessor:
  num_top_queries: 600

# ----------------- 训练超参数与对齐 -----------------
optimizer:
  type: AdamW
  params: 
    -
      params: '^(?=.*.dinov3)(?!.*(?:norm|bn|bias)).*$'  
      lr: 0.000025
    -
      params: '^(?=.*.dinov3)(?=.*(?:norm|bn|bias)).*$'    
      lr: 0.000025
      weight_decay: 0.
    - 
      params: '^(?=.*(?:sta|encoder|decoder))(?=.*(?:norm|bn|bias)).*$'
      weight_decay: 0.
  lr: 0.00025
  betas: [0.9, 0.999]
  weight_decay: 0.0001

epoches: 120
lrsheduler: flatcosine
lr_gamma: 0.5
warmup_iter: 2000
flat_epoch: 51
no_aug_epoch: 9

train_dataloader:
  total_batch_size: 16
  num_workers: 6
  dataset: 
    transforms:
      ops:
        - {type: Mosaic, output_size: 320, rotation_range: 10, translation_range: [0.1, 0.1], scaling_range: [0.5, 1.5],
           probability: 0.6, fill_value: 0, use_cache: True, max_cached_images: 50, random_pop: True}
        - {type: RandomPhotometricDistort, p: 0.5}
        - {type: RandomZoomOut, fill: 0}
        - {type: RandomIoUCrop, p: 0.5}
        - {type: SanitizeBoundingBoxes, min_size: 1}
        - {type: RandomHorizontalFlip}
        - {type: Resize, size: [640, 640], }
        - {type: SanitizeBoundingBoxes, min_size: 1}
        - {type: ConvertPILImage, dtype: 'float32', scale: True}
        - {type: Normalize, mean: [0.485, 0.456, 0.406], std: [0.229, 0.224, 0.225]}
        - {type: ConvertBoxes, fmt: 'cxcywh', normalize: True}
      policy:
        epoch: [4, 51, 111]

  collate_fn:
    base_size: 640
    mixup_prob: 0.3
    ema_restart_decay: 0.9999
    base_size_repeat: 20
    mixup_epochs: [4, 51]
    stop_epoch: 111
    copyblend_epochs: [4, 111]

val_dataloader:
  total_batch_size: 32
  num_workers: 6
  dataset:
    transforms:
      ops:
        - {type: Resize, size: [640, 640], }
        - {type: ConvertPILImage, dtype: 'float32', scale: True}
        - {type: Normalize, mean: [0.485, 0.456, 0.406], std: [0.229, 0.224, 0.225]}

# ----------------- 专为微小目标与创新结构打造的Loss -----------------
DEIMCriterion:
  # Tiny targets are sensitive to localization error, so box costs are kept high.
  weight_dict: {loss_mal: 1, loss_bbox: 8.0, loss_giou: 2.0, loss_fgl: 0.15, loss_ddf: 1.5}
  matcher:
    change_matcher: True
    iou_order_alpha: 4.0
    matcher_change_epoch: 75
    weight_dict: {cost_class: 2.0, cost_bbox: 8.0, cost_giou: 2.0}
