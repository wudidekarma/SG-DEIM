__include__: [
  '../dataset/visdrone_detection.yml',
  '../runtime.yml',
  '../base/dataloader.yml',
  '../base/optimizer.yml',
  '../base/deimv2.yml',
]

output_dir: ./outputs/SG-DEIM_dinov3_m_combined_visdrone800

# ---- Override num_classes for VisDrone (10 classes) ----
num_classes: 10

# ---- Print every 50 iters; save every 5 epochs ----
print_freq: 50
checkpoint_freq: 5
eval_spatial_size: [800, 800]
use_ema: True
ema:
  type: ModelEMA
  decay: 0.9999
  warmups: 1000

# Model architecture (SG-DEIM)
DEIM:
  backbone: DINOv3STAs
  encoder: SGDEIMEncoder    # paper: CGSR + CSAI encoder
  decoder: DEIMTransformer

# DINOv3 ViT-TinyPlus Backbone (M-level configuration)
DINOv3STAs:
  name: vit_tinyplus
  embed_dim: 256
  weights_path: ./ckpts/vittplus_distill.pt
  interaction_indexes: [0, 3, 7, 11]   # maps to [1/4, 1/8, 1/16, 1/32] for full C2/P2 access
  num_heads: 4

# ========== CGSR + Cross-Scale Adaptive Interaction (CSAI) Encoder ==========
SGDEIMEncoder:
  in_channels: [256, 256, 256, 256]
  feat_strides: [4, 8, 16, 32]
  depth_mult: 1           # M-level setting
  expansion: 0.67         # M-level setting
  hidden_dim: 256         # M-level setting
  dim_feedforward: 512
  use_encoder_idx: [3]  # apply transformer to the lowest resolution / highest stride layer (index 3 is 1/32)
  version: 'deim'
  fuse_op: 'sum'
  # CGSR + CSAI configuration.
  use_csai: True
  csai_position: 'both'        # Apply to both FPN and PAN
  csai_type: 'efficient'       # Efficient CSAI implementation
  csai_kernel_size: 5          # Larger kernel for more context
  csai_reduction: 4
  use_cgsr: True
  cgsr_num_bands: 4
  cgsr_reduction: 4
  cgsr_max_strength: 0.5

# ========== Query-Conditioned Attention Gating (QCAG) Decoder ==========
DEIMTransformer:
  feat_channels: [256, 256, 256, 256]
  feat_strides: [4, 8, 16, 32]
  num_levels: 4
  num_points: [3, 3, 6, 3]
  hidden_dim: 256         # M-level setting
  dim_feedforward: 512
  num_layers: 4
  eval_idx: -1
  num_queries: 400
  num_denoising: 50
  # QCAG configuration
  use_qcag: True
  qcag_mode: 'headwise_v2'     # MLP-based gating (recommended)
  qcag_residual_ratio: 0.1

PostProcessor:
  num_top_queries: 400  # must match num_queries

# ---- Optimizer ----
optimizer:
  type: AdamW
  params:
    -
      params: '^(?=.*.dinov3)(?!.*(?:norm|bn|bias)).*$'
      lr: 0.000025
    -
      params: '^(?=.*.dinov3)(?=.*(?:norm|bn|bias)).*$'
      lr: 0.000025
      weight_decay: 0.
    -
      params: '^(?=.*(?:sta|encoder|decoder))(?=.*(?:norm|bn|bias)).*$'
      weight_decay: 0.

  lr: 0.0002     # Adjusted appropriately from 0.0002 because batch size was halved
  betas: [0.9, 0.999]
  weight_decay: 0.0005

# ---- Epoch schedule ----
epoches: 200

# ---- LR scheduler ----
lrsheduler: flatcosine
lr_gamma: 0.5
warmup_iter: 5000
flat_epoch: 140
no_aug_epoch: 20

# ---- DataLoader ----
train_dataloader:
  total_batch_size: 4
  num_workers: 6
  dataset:
    transforms:
      ops:
        - {type: Mosaic, output_size: 800, rotation_range: 5, translation_range: [0.1, 0.1], scaling_range: [0.7, 1.3],
           probability: 0.5, fill_value: 0, use_cache: True, max_cached_images: 50, random_pop: True}
        - {type: RandomPhotometricDistort, p: 0.3}
        - {type: RandomZoomOut, fill: 0, p: 0.05}
        - {type: RandomIoUCrop, p: 0.25}
        - {type: SanitizeBoundingBoxes, min_size: 1}
        - {type: RandomHorizontalFlip}
        - {type: Resize, size: [800, 800], }
        - {type: SanitizeBoundingBoxes, min_size: 1}
        - {type: ConvertPILImage, dtype: 'float32', scale: True}
        - {type: Normalize, mean: [0.485, 0.456, 0.406], std: [0.229, 0.224, 0.225]}
        - {type: ConvertBoxes, fmt: 'cxcywh', normalize: True}
      policy:
        epoch: [4, 140, 180]

  collate_fn:
    base_size: 800
    mixup_prob: 0.2
    ema_restart_decay: 0.9999
    base_size_repeat: 20
    mixup_epochs: [4, 140]
    stop_epoch: 180
    copyblend_epochs: [4, 180]
    copyblend_prob: 0.35
    area_threshold: 100
    num_objects: 3
    with_expand: True
    expand_ratios: [0.1, 0.25]

val_dataloader:
  total_batch_size: 8
  num_workers: 6
  dataset:
    transforms:
      ops:
        - {type: Resize, size: [800, 800], }
        - {type: ConvertPILImage, dtype: 'float32', scale: True}
        - {type: Normalize, mean: [0.485, 0.456, 0.406], std: [0.229, 0.224, 0.225]}

# ---- Loss ----
DEIMCriterion:
  weight_dict: {loss_mal: 1, loss_bbox: 5, loss_giou: 2, loss_fgl: 0.15, loss_ddf: 1.5}
  losses: ['mal', 'boxes', 'local']
  gamma: 1.5
  alpha: 0.75
  reg_max: 32
  matcher:
    type: HungarianMatcher
    weight_dict: {cost_class: 2, cost_bbox: 5, cost_giou: 2}
    alpha: 0.25
    gamma: 2.0
    change_matcher: True
    iou_order_alpha: 4.0
    matcher_change_epoch: 140
