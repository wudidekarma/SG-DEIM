__include__: [
  '../deimv2/deimv2_dinov3_s_aitod.yml',
]

# AI-TOD-v1 reproduction recipe for the current CGSR + QCAG model.
# The optimization schedule is reconstructed from the old 26.4-AP run's log
# and checkpoint (P2, 800 px, 1500 queries, global batch 8, compressed DN).
output_dir: ./outputs/SG-DEIM_dinov3_s_aitodv1_800_repro_seed0
eval_spatial_size: [800, 800]
print_freq: 50
checkpoint_freq: 5
use_ema: True

ema:
  type: ModelEMA
  decay: 0.9999
  warmups: 1000

DEIM:
  backbone: DINOv3STAs
  encoder: SGDEIMEncoder
  decoder: DEIMTransformer

# P2--P5, identical to the successful dense tiny-object profile.
DINOv3STAs:
  name: vit_tiny
  embed_dim: 192
  weights_path: ./ckpts/vitt_distill.pt
  interaction_indexes: [0, 3, 7, 11]
  num_heads: 3

# CGSR and CSAI encoder configuration.
SGDEIMEncoder:
  in_channels: [192, 192, 192, 192]
  feat_strides: [4, 8, 16, 32]
  depth_mult: 0.67
  expansion: 0.34
  hidden_dim: 192
  dim_feedforward: 512
  use_encoder_idx: [3]
  version: 'deim'
  fuse_op: 'sum'
  use_csai: True
  csai_position: 'both'
  csai_type: 'efficient'
  csai_kernel_size: 5
  csai_reduction: 4
  use_cgsr: True
  cgsr_num_bands: 4
  cgsr_reduction: 4
  cgsr_max_strength: 0.5
  cgsr_context_source: 'coarse'
  cgsr_context_intervention: 'normal'

DEIMTransformer:
  feat_channels: [192, 192, 192, 192]
  feat_strides: [4, 8, 16, 32]
  num_levels: 4
  num_points: [3, 3, 6, 3]
  hidden_dim: 192
  dim_feedforward: 512
  num_layers: 4
  eval_idx: -1
  num_queries: 1500
  # The old "dncmp" recipe: retain DN but cap only its sampled GTs per image.
  # Normal matching/losses still use every annotation.
  num_denoising: 50
  dn_max_gt_num: 15
  use_qcag: True
  qcag_mode: 'headwise_v2'
  qcag_residual_ratio: 0.1
  qcag_condition_source: 'query'
  qcag_intervention: 'normal'

PostProcessor:
  num_top_queries: 1500

# Exact initial learning rates/weight decay recovered from the old checkpoint.
optimizer:
  type: AdamW
  params:
    -
      params: '^(?=.*.dinov3)(?!.*(?:norm|bn|bias)).*$'
      lr: 0.000025
    -
      params: '^(?=.*.dinov3)(?=.*(?:norm|bn|bias)).*$'
      lr: 0.000025
      weight_decay: 0.
    -
      params: '^(?=.*(?:sta|encoder|decoder))(?=.*(?:norm|bn|bias)).*$'
      weight_decay: 0.
  lr: 0.0005
  betas: [0.9, 0.999]
  weight_decay: 0.0001

# Exact flat-cosine trajectory recovered from the old log/checkpoint.
epoches: 180
lrsheduler: flatcosine
lr_gamma: 0.5
warmup_iter: 3000
flat_epoch: 100
no_aug_epoch: 20

train_dataloader:
  total_batch_size: 8
  num_workers: 6
  dataset:
    transforms:
      ops:
        - {type: Mosaic, output_size: 800, rotation_range: 5, translation_range: [0.1, 0.1], scaling_range: [0.7, 1.3],
           probability: 0.5, fill_value: 0, use_cache: True, max_cached_images: 50, random_pop: True}
        - {type: RandomPhotometricDistort, p: 0.3}
        - {type: RandomZoomOut, fill: 0, p: 0.05}
        - {type: RandomIoUCrop, p: 0.25}
        - {type: SanitizeBoundingBoxes, min_size: 1}
        - {type: RandomHorizontalFlip}
        - {type: Resize, size: [800, 800]}
        - {type: SanitizeBoundingBoxes, min_size: 1}
        - {type: ConvertPILImage, dtype: 'float32', scale: True}
        - {type: Normalize, mean: [0.485, 0.456, 0.406], std: [0.229, 0.224, 0.225]}
        - {type: ConvertBoxes, fmt: 'cxcywh', normalize: True}
      policy:
        epoch: [4, 100, 160]
      mosaic_prob: 0.5
  collate_fn:
    base_size: 800
    base_size_repeat: 20
    mixup_prob: 0.2
    mixup_epochs: [4, 100]
    stop_epoch: 160
    copyblend_epochs: [4, 160]
    copyblend_prob: 0.35
    area_threshold: 100
    num_objects: 3
    with_expand: True
    expand_ratios: [0.1, 0.25]
    ema_restart_decay: 0.9999

val_dataloader:
  total_batch_size: 16
  num_workers: 6
  dataset:
    transforms:
      ops:
        - {type: Resize, size: [800, 800]}
        - {type: ConvertPILImage, dtype: 'float32', scale: True}
        - {type: Normalize, mean: [0.485, 0.456, 0.406], std: [0.229, 0.224, 0.225]}

DEIMCriterion:
  weight_dict: {loss_mal: 1, loss_bbox: 5, loss_giou: 2, loss_fgl: 0.15, loss_ddf: 1.5}
  losses: ['mal', 'boxes', 'local']
  gamma: 1.5
  alpha: 0.75
  reg_max: 32
  matcher:
    type: HungarianMatcher
    weight_dict: {cost_class: 2, cost_bbox: 5, cost_giou: 2}
    alpha: 0.25
    gamma: 2.0
    change_matcher: True
    iou_order_alpha: 4.0
    matcher_change_epoch: 110
