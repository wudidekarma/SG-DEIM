task: detection

evaluator:
  type: CocoEvaluator
  iou_types: ['bbox', ]

num_classes: 1
remap_mscoco_category: False

train_dataloader:
  type: DataLoader
  dataset:
    type: CocoDetection
    img_folder: /media/q/data/ys/datasets/TinyPerson/OpenDataLab___TinyPerson/aw1/train
    ann_file: /media/q/data/ys/datasets/TinyPerson/fgdeim/annotations/instances_train_patch640.json
    return_masks: False
    transforms:
      type: Compose
      ops: ~
  shuffle: True
  num_workers: 6
  drop_last: True
  collate_fn:
    type: BatchImageCollateFunction

val_dataloader:
  type: DataLoader
  dataset:
    type: CocoDetection
    img_folder: /media/q/data/ys/datasets/TinyPerson/OpenDataLab___TinyPerson/raw1/test
    ann_file: /media/q/data/ys/datasets/TinyPerson/fgdeim/annotations/instances_val_patch640.json
    return_masks: False
    transforms:
      type: Compose
      ops: ~
  shuffle: False
  num_workers: 6
  drop_last: False
  collate_fn:
    type: BatchImageCollateFunction
