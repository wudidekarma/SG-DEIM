task: detection

evaluator:
  type: CocoEvaluator
  iou_types: ['bbox', ]

num_classes: 10
remap_mscoco_category: False

train_dataloader:
  type: DataLoader
  dataset:
    type: CocoDetection
    img_folder: /media/q/data/ys/YS/VIS/DEIMv2-main/VisDrone_Dataset/VisDrone2019-DET-train/images/
    ann_file: /media/q/data/ys/YS/VIS/DEIMv2-main/VisDrone_Dataset/annotations/train.json
    return_masks: False
    transforms:
      type: Compose
      ops: ~
  shuffle: True
  num_workers: 4
  drop_last: True
  collate_fn:
    type: BatchImageCollateFunction


val_dataloader:
  type: DataLoader
  dataset:
    type: CocoDetection
    img_folder: /media/q/data/ys/YS/VIS/DEIMv2-main/VisDrone_Dataset/VisDrone2019-DET-val/images/
    ann_file: /media/q/data/ys/YS/VIS/DEIMv2-main/VisDrone_Dataset/annotations/val.json
    return_masks: False
    transforms:
      type: Compose
      ops: ~
  shuffle: False
  num_workers: 4
  drop_last: False
  collate_fn:
    type: BatchImageCollateFunction
