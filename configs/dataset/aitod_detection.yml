task: detection

evaluator:
  type: CocoEvaluator
  iou_types: ['bbox', ]

num_classes: 8 # AI-TOD typically has 8 classes
remap_mscoco_category: True

train_dataloader: 
  type: DataLoader
  dataset: 
    type: CocoDetection
    img_folder: /media/q/data/ys/datasets/aitodtoolkit/aitod/images/train
    ann_file: /media/q/data/ys/datasets/aitodtoolkit/aitod/annotations/aitod_train.json
    return_masks: False
    transforms:
      type: Compose
      ops: ~
  shuffle: True
  num_workers: 4
  drop_last: True 
  collate_fn:
    type: BatchImageCollateFunction

val_dataloader:
  type: DataLoader
  dataset: 
    type: CocoDetection
    img_folder: /media/q/data/ys/datasets/aitodtoolkit/aitod/images/val
    ann_file: /media/q/data/ys/datasets/aitodtoolkit/aitod/annotations/aitod_val.json
    return_masks: False
    transforms:
      type: Compose
      ops: ~ 
  shuffle: False
  num_workers: 4
  drop_last: False
  collate_fn:
    type: BatchImageCollateFunction
